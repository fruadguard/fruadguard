<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | FraudGuard</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">

</head>

<body>

<nav class="navbar">

<div class="logo">

<a href="index.html">

<img src="logo.png" alt="FraudGuard">

<span>FraudGuard</span>

</a>

</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="scanner.html">URL Scanner</a></li>
<li><a href="phone-checker.html">Phone Checker</a></li>
<li><a href="report.html">Report</a></li>

</ul>

</nav>

<section class="scanner">

<h1>📊 FraudGuard Dashboard</h1>

<p>Welcome back!</p>

<div class="card">

<h2>User Information</h2>

<p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>

<p><strong>Membership:</strong> <span id="membership">Checking...</span></p>

</div>

<div class="card">

<h2>Statistics</h2>

<p>🌐 Total Website Scans: <span id="totalScans">0</span></p>

<p>🚨 Total Scam Reports: <span id="totalReports">0</span></p>

</div>

<div class="card">

<h2>Recent Activity</h2>

<div id="activityList">

<p>No activity yet.</p>

</div>

</div>

<br>

<button onclick="logout()" class="btn-primary">

🚪 Logout

</button>

</section>

<script type="module">

import { auth, db } from "./firebase.js";

import {

onAuthStateChanged,

signOut

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {

doc,

getDoc

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const userEmail=document.getElementById("userEmail");

const membership=document.getElementById("membership");

onAuthStateChanged(auth,async(user)=>{

if(user){

userEmail.innerText=user.email;

try{

const snap=await getDoc(doc(db,"subscriptions",user.uid));

if(snap.exists()){

const data=snap.data();

if(data.premium===true){

membership.innerHTML="👑 Premium Member";

}else{

membership.innerHTML="🆓 Free Member";

}

}else{

membership.innerHTML="🆓 Free Member";

}

}catch(error){

console.log(error);

membership.innerHTML="🆓 Free Member";

}

}else{

window.location.href="login.html";

}

});

window.logout=async function(){

try{

await signOut(auth);

window.location.href="login.html";

}catch(error){

alert(error.message);

}

};

</script>

</body>

</html>
