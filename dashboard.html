<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
FraudGuard Dashboard
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>




<section class="section">



<h1>

🛡️ FraudGuard Dashboard

</h1>



<div class="dashboard-box">





<div class="dashboard-item">


<h3>

User Profile

</h3>



<p id="userName">

Loading...

</p>



<p id="userEmail">

Loading...

</p>



</div>







<div class="dashboard-item">


<h3>

Subscription

</h3>



<p id="userPlan">

Checking...

</p>



<p id="subscriptionStatus">

</p>



</div>







<div class="dashboard-item">


<h3>

Security Status

</h3>



<p>

🟢 Protected

</p>



</div>





</div>





<button

id="logoutBtn"

class="btn">

Logout

</button>




</section>








<script type="module">


import {

checkUser,

getUserData,

logoutUser

}

from "./firebase.js";








const nameBox =

document.getElementById(
"userName"
);



const emailBox =

document.getElementById(
"userEmail"
);



const planBox =

document.getElementById(
"userPlan"
);



const statusBox =

document.getElementById(
"subscriptionStatus"
);







checkUser(async(user)=>{



if(!user){


window.location.href =
"login.html";


return;


}






const data =

await getUserData(
user.uid
);






if(data){



nameBox.innerHTML =

"Name: "
+
data.name;





emailBox.innerHTML =

"Email: "
+
data.email;






planBox.innerHTML =

"Plan: "
+
data.plan;






statusBox.innerHTML =

"Status: "
+
data.subscriptionStatus;



}





});








document

.getElementById(
"logoutBtn"
)

.addEventListener(

"click",

async()=>{



await logoutUser();



window.location.href =

"login.html";



}



);



</script>




</body>


</html>
