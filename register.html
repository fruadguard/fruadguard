<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Create Account - FraudGuard
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<div class="auth-container">



<div class="auth-box">



<h1>

Fraud<span>Guard</span>

</h1>



<h2>

Create Account

</h2>



<p>

Join FraudGuard and stay protected.

</p>





<input

type="text"

id="name"

placeholder="Full Name"

required>




<input

type="email"

id="email"

placeholder="Email Address"

required>




<input

type="password"

id="password"

placeholder="Password"

required>




<input

type="password"

id="confirmPassword"

placeholder="Confirm Password"

required>
<button 
class="btn"
onclick="registerUser()">

Create Account

</button>




<div class="divider">

<span>
OR
</span>

</div>





<button

class="social-btn google"

onclick="googleLogin()">

🔵 Continue with Google

</button>





<button

class="social-btn facebook"

onclick="facebookLogin()">

🔵 Continue with Facebook

</button>




<p class="auth-link">


Already have an account?


<a href="login.html">

Login

</a>


</p>



<a href="index.html">

← Back to Home

</a>
</div>


</div>




<script type="module" src="auth.js"></script>


</body>

</html>
