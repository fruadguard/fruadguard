<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
FraudGuard Register
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="section">


<h2>
Create FraudGuard Account
</h2>


<div class="analyzer-box">


<input 
id="name"
type="text"
placeholder="Full Name"
>



<input 
id="email"
type="email"
placeholder="Email Address"
>



<input 
id="password"
type="password"
placeholder="Password"
>



<button 
id="registerBtn"
class="btn">

Create Account

</button>



<p id="message"></p>



</div>


</section>




<script type="module">


import { registerUser }

from "./firebase.js";



const button =
document.getElementById(
"registerBtn"
);



button.addEventListener(
"click",
async()=>{


const name =
document.getElementById(
"name"
).value;



const email =
document.getElementById(
"email"
).value;



const password =
document.getElementById(
"password"
).value;



const message =
document.getElementById(
"message"
);



try{


await registerUser(
email,
password,
name
);



message.innerHTML =
"Account Created Successfully!";



setTimeout(()=>{


window.location.href =
"dashboard.html";


},1500);



}

catch(error){



message.innerHTML =
error.message;



}



});


</script>



</body>

</html>
