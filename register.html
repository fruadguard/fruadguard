<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - FraudGuard</title>

<meta name="description"
content="Create your FraudGuard account.">

<link rel="icon" href="logo.png">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="auth-section">

<div class="auth-box">

<div style="text-align:center;margin-bottom:25px;">

<img src="logo.png"
alt="FraudGuard"
style="width:90px;">

<h1>Create Account</h1>

<p>Join FraudGuard and stay protected.</p>

</div>

<form id="registerForm">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
required>

</div>

<div class="input-group">

<label>Username</label>

<input
type="text"
id="userName"
placeholder="Choose a username"
required>

</div>

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="registerEmail"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Phone Number</label>

<input
type="tel"
id="phoneNumber"
placeholder="+8801XXXXXXXXX"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="registerPassword"
placeholder="Create a password"
required>

</div>

<div class="input-group">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
required>

</div>
<!-- TERMS CHECKBOX -->

<div class="terms-box">

<label>

<input 
type="checkbox"
id="termsCheck"
required>

I agree to FraudGuard 
<a href="#">
Terms & Conditions
</a>

</label>

</div>





<!-- CREATE ACCOUNT BUTTON -->

<button

type="button"

class="btn"

onclick="registerUser()">

<i class="fa-solid fa-user-plus"></i>

Create Account

</button>





<!-- DIVIDER -->

<div class="divider">

<span>OR</span>

</div>





<!-- GOOGLE SIGN UP -->

<button

type="button"

class="btn google-btn"

id="googleRegisterBtn">

<i class="fa-brands fa-google"></i>

Continue with Google

</button>





<!-- LOGIN LINK -->

<p class="register-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>


</form>


</div>

</div>
<!-- =========================
        FOOTER
========================= -->

<footer>

<div class="container">

<p>

© 2026 FraudGuard. All Rights Reserved.

</p>

</div>

</footer>





<!-- FIREBASE -->

<script type="module" src="firebase.js"></script>





<!-- MAIN SCRIPT -->

<script src="script.js"></script>


</body>

</html>
