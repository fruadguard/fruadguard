<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — Inspect Caller</title>

    <meta
        name="description"
        content="Create your secure Inspect Caller account."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ================= PAGE ================= */

        .register-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 35px 16px;

            position: relative;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 5%,
                    rgba(0,150,255,.16),
                    transparent 42%
                ),
                #050d18;

        }


        /* ================= BACKGROUND ================= */

        .register-orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(75px);

            pointer-events: none;

        }

        .orb-one {

            width: 230px;
            height: 230px;

            left: 5%;
            top: 10%;

            background:
                rgba(0,140,255,.08);

            animation:
                floatOrb 8s ease-in-out infinite;

        }

        .orb-two {

            width: 260px;
            height: 260px;

            right: 3%;
            bottom: 3%;

            background:
                rgba(0,220,180,.06);

            animation:
                floatOrb 10s ease-in-out infinite reverse;

        }

        @keyframes floatOrb {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

        }


        /* ================= WRAPPER ================= */

        .register-wrapper {

            width:
                min(460px, 100%);

            position: relative;

            z-index: 2;

            animation:
                registerEnter .7s ease;

        }

        @keyframes registerEnter {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* ================= CARD ================= */

        .register-card {

            padding: 34px;

            border:
                1px solid #1d465e;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10,32,52,.97),
                    rgba(5,19,31,.97)
                );

            box-shadow:
                0 30px 90px
                rgba(0,80,140,.18);

            backdrop-filter:
                blur(18px);

        }


        /* ================= BRAND ================= */

        .register-brand {

            text-align: center;

            margin-bottom: 25px;

        }

        .brand-icon {

            width: 62px;
            height: 62px;

            display: grid;

            place-items: center;

            margin:
                0 auto 15px;

            border:
                1px solid #2a7398;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #0b3652,
                    #071a2b
                );

            box-shadow:
                0 0 35px
                rgba(0,150,255,.12);

            font-size: 27px;

            animation:
                shieldPulse 2.5s ease-in-out infinite;

        }

        @keyframes shieldPulse {

            0%,100% {
                box-shadow:
                    0 0 25px
                    rgba(0,150,255,.08);
            }

            50% {
                box-shadow:
                    0 0 45px
                    rgba(0,150,255,.2);
            }

        }


        .register-brand h1 {

            font-size: 25px;

            letter-spacing: -.8px;

        }

        .register-brand h1 span {

            color: var(--blue);

        }

        .register-brand p {

            margin-top: 7px;

            color: var(--muted);

            font-size: 11px;

        }


        /* ================= MESSAGE ================= */

        .form-message {

            display: none;

            margin-bottom: 15px;

            padding:
                11px 13px;

            border-left:
                3px solid #ff687e;

            border-radius: 9px;

            background:
                rgba(255,70,95,.06);

            color: #e7aeb6;

            font-size: 10px;

            line-height: 1.5;

        }

        .form-message.success {

            border-left-color:
                #38df9b;

            background:
                rgba(45,228,154,.06);

            color: #9de4c7;

        }

        .form-message.show {

            display: block;

        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 15px;

        }

        .form-label {

            display: block;

            margin-bottom: 7px;

            color: #b9d2de;

            font-size: 10px;

            font-weight: 800;

        }


        .input-wrap {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 14px;

            opacity: .8;

        }


        .register-input {

            width: 100%;

            min-height: 48px;

            padding:
                0 43px;

            border:
                1px solid #28536b;

            border-radius: 13px;

            outline: none;

            background: #061725;

            color: white;

            font-size: 12px;

            transition: .2s;

        }

        .register-input::placeholder {

            color: #587384;

        }

        .register-input:focus {

            border-color:
                #24b7ff;

            box-shadow:
                0 0 0 3px
                rgba(0,160,255,.08);

        }


        .password-toggle {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #7895a5;

            cursor: pointer;

            font-size: 14px;

        }


        /* ================= PASSWORD STRENGTH ================= */

        .strength-container {

            margin-top: 8px;

        }

        .strength-bar {

            height: 4px;

            overflow: hidden;

            border-radius: 99px;

            background: #122b3d;

        }

        .strength-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            transition: .25s;

            background: #ff687e;

        }

        .strength-text {

            margin-top: 5px;

            color: #627d8c;

            font-size: 8px;

        }


        /* ================= TERMS ================= */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin:
                17px 0 19px;

            color: #718a99;

            font-size: 9px;

            line-height: 1.6;

        }

        .terms input {

            margin-top: 2px;

            accent-color:
                #159ddd;

        }

        .terms a {

            color: #6fd4ff;

        }


        /* ================= REGISTER BUTTON ================= */

        .register-btn {

            width: 100%;

            min-height: 50px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #25b5ff,
                    #087ddd
                );

            color: white;

            font-size: 12px;

            font-weight: 900;

            cursor: pointer;

            transition: .25s;

            box-shadow:
                0 10px 30px
                rgba(0,130,220,.15);

        }

        .register-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 35px
                rgba(0,140,255,.25);

        }

        .register-btn:disabled {

            opacity: .65;

            cursor: not-allowed;

            transform: none;

        }


        /* ================= DIVIDER ================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 20px 0;

            color: #536f7f;

            font-size: 8px;

        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #18394e;

        }


        /* ================= GOOGLE ================= */

        .google-btn {

            width: 100%;

            min-height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            border:
                1px solid #28536b;

            border-radius: 13px;

            background: #071b2b;

            color: #c2d5de;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;

        }

        .google-btn:hover {

            border-color: #397a9e;

            background: #092238;

        }


        /* ================= LOGIN ================= */

        .login-text {

            margin-top: 21px;

            text-align: center;

            color: #708a99;

            font-size: 10px;

        }

        .login-text a {

            color: #6fd4ff;

            font-weight: 800;

        }


        /* ================= SECURITY ================= */

        .security-note {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 18px;

            color: #5f7887;

            font-size: 8px;

        }


        /* ================= MOBILE ================= */

        @media(max-width:500px) {

            .register-page {

                padding:
                    20px 12px;

            }

            .register-card {

                padding:
                    25px 20px;

            }

        }

    </style>

</head>


<body>


<div class="register-page">


    <div class="register-orb orb-one"></div>

    <div class="register-orb orb-two"></div>


    <div class="register-wrapper">


        <div class="register-card">


            <!-- BRAND -->

            <div class="register-brand">

                <div class="brand-icon">
                    🛡️
                </div>


                <h1>

                    INSPECT<span>CALLER</span>

                </h1>


                <p>
                    Create your secure digital
                    safety account
                </p>

            </div>



            <!-- MESSAGE -->

            <div
                id="formMessage"
                class="form-message">
            </div>



            <!-- FORM -->

            <form
                id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="fullName">

                        Full Name

                    </label>


                    <div class="input-wrap">

                        <span class="input-icon">
                            👤
                        </span>


                        <input
                            type="text"
                            id="fullName"
                            class="register-input"
                            placeholder="Your full name"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="email">

                        Email Address

                    </label>


                    <div class="input-wrap">

                        <span class="input-icon">
                            ✉️
                        </span>


                        <input
                            type="email"
                            id="email"
                            class="register-input"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="password">

                        Password

                    </label>


                    <div class="input-wrap">

                        <span class="input-icon">
                            🔒
                        </span>


                        <input
                            type="password"
                            id="password"
                            class="register-input"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword">

                            👁️

                        </button>

                    </div>


                    <div class="strength-container">

                        <div class="strength-bar">

                            <div
                                id="strengthFill"
                                class="strength-fill">
                            </div>

                        </div>


                        <div
                            id="strengthText"
                            class="strength-text">

                            Use at least 6 characters.

                        </div>

                    </div>

                </div>



                <!-- CONFIRM -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="confirmPassword">

                        Confirm Password

                    </label>


                    <div class="input-wrap">

                        <span class="input-icon">
                            🔐
                        </span>


                        <input
                            type="password"
                            id="confirmPassword"
                            class="register-input"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirm">

                            👁️

                        </button>

                    </div>

                </div>



                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >


                    <span>

                        I agree to the
                        <a href="terms.html">
                            Terms of Service
                        </a>
                        and
                        <a href="privacy-policy.html">
                            Privacy Policy
                        </a>.

                    </span>

                </label>



                <!-- REGISTER -->

                <button
                    type="submit"
                    class="register-btn"
                    id="registerBtn">

                    🛡️ Create Secure Account

                </button>


            </form>



            <!-- DIVIDER -->

            <div class="divider">
                OR
            </div>



            <!-- GOOGLE -->

            <button
                type="button"
                class="google-btn"
                id="googleRegister">

                <span>
                    G
                </span>

                Continue with Google

            </button>



            <!-- LOGIN -->

            <div class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>



            <!-- SECURITY -->

            <div class="security-note">

                🔒

                Secure authentication

                •

                Inspect Caller

            </div>


        </div>


    </div>

</div>



<!-- ================= FIREBASE ================= -->

<script type="module">


import {
    auth,
    db
} from "./firebase.js";


import {
    createUserWithEmailAndPassword,
    updateProfile,
    GoogleAuthProvider,
    signInWithPopup
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


import {
    doc,
    setDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";



/* ================= ELEMENTS ================= */

const form =
    document.getElementById(
        "registerForm"
    );


const fullName =
    document.getElementById(
        "fullName"
    );


const email =
    document.getElementById(
        "email"
    );


const password =
    document.getElementById(
        "password"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const registerBtn =
    document.getElementById(
        "registerBtn"
    );


const message =
    document.getElementById(
        "formMessage"
    );



/* ================= MESSAGE ================= */

function showMessage(
    text,
    success = false
) {

    message.textContent =
        text;

    message.classList.add(
        "show"
    );


    if (success) {

        message.classList.add(
            "success"
        );

    } else {

        message.classList.remove(
            "success"
        );

    }

}


function hideMessage() {

    message.textContent =
        "";

    message.classList.remove(
        "show",
        "success"
    );

}



/* ================= PASSWORD TOGGLE ================= */

function setupToggle(
    buttonId,
    input
) {

    document
        .getElementById(buttonId)
        .addEventListener(
            "click",
            function() {

                const hidden =
                    input.type ===
                    "password";


                input.type =
                    hidden
                        ? "text"
                        : "password";


                this.textContent =
                    hidden
                        ? "🙈"
                        : "👁️";

            }
        );

}


setupToggle(
    "togglePassword",
    password
);


setupToggle(
    "toggleConfirm",
    confirmPassword
);



/* ================= PASSWORD STRENGTH ================= */

password.addEventListener(
    "input",
    function() {

        const value =
            password.value;


        const fill =
            document.getElementById(
                "strengthFill"
            );


        const text =
            document.getElementById(
                "strengthText"
            );


        let strength = 0;


        if (value.length >= 6)
            strength++;


        if (value.length >= 10)
            strength++;


        if (/[A-Z]/.test(value))
            strength++;


        if (/[0-9]/.test(value))
            strength++;


        if (/[^A-Za-z0-9]/.test(value))
            strength++;


        const widths =
            [
                "20%",
                "40%",
                "60%",
                "80%",
                "100%"
            ];


        fill.style.width =
            value.length
                ? widths[
                    Math.max(
                        0,
                        strength - 1
                    )
                ]
                : "0%";


        if (!value) {

            text.textContent =
                "Use at least 6 characters.";

            fill.style.background =
                "#ff687e";

        }

        else if (strength <= 2) {

            text.textContent =
                "Weak password";

            fill.style.background =
                "#ff687e";

        }

        else if (strength <= 3) {

            text.textContent =
                "Medium password";

            fill.style.background =
                "#ffd267";

        }

        else {

            text.textContent =
                "Strong password";

            fill.style.background =
                "#38df9b";

        }

    }
);



/* ================= REGISTER ================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessage();


        const name =
            fullName.value.trim();


        const userEmail =
            email.value.trim();


        const pass =
            password.value;


        const confirm =
            confirmPassword.value;



        if (pass !== confirm) {

            showMessage(
                "Passwords do not match."
            );

            confirmPassword.focus();

            return;

        }


        if (pass.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;

        }


        registerBtn.disabled =
            true;

        registerBtn.textContent =
            "⏳ Creating account...";


        try {


            /* CREATE FIREBASE USER */

            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    userEmail,
                    pass
                );


            const user =
                credential.user;



            /* SAVE DISPLAY NAME */

            await updateProfile(
                user,
                {
                    displayName: name
                }
            );



            /*
                SAVE USER PROFILE

                Firestore path:

                users/{user.uid}
            */

            await setDoc(
                doc(
                    db,
                    "users",
                    user.uid
                ),
                {

                    uid:
                        user.uid,

                    name:
                        name,

                    email:
                        userEmail,

                    role:
                        "user",

                    accountStatus:
                        "active",

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );


            showMessage(
                "Account created successfully. Redirecting...",
                true
            );


            registerBtn.textContent =
                "✓ Account Created";


            setTimeout(
                function() {

                    window.location.href =
                        "dashboard.html";

                },
                800
            );


        } catch(error) {

            console.error(error);


            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "🛡️ Create Secure Account";


            let errorText =
                "Unable to create account. Please try again.";


            switch(error.code) {

                case "auth/email-already-in-use":

                    errorText =
                        "An account already exists with this email.";

                    break;


                case "auth/invalid-email":

                    errorText =
                        "Please enter a valid email address.";

                    break;


                case "auth/weak-password":

                    errorText =
                        "Please choose a stronger password.";

                    break;


                case "auth/network-request-failed":

                    errorText =
                        "Network error. Check your internet connection.";

                    break;

            }


            showMessage(
                errorText
            );

        }

    }
);



/* ================= GOOGLE REGISTER ================= */

document
    .getElementById(
        "googleRegister"
    )
    .addEventListener(
        "click",
        async function() {

            hideMessage();


            try {

                const provider =
                    new GoogleAuthProvider();


                const credential =
                    await signInWithPopup(
                        auth,
                        provider
                    );


                const user =
                    credential.user;


                /*
                    Create/update Firestore
                    profile for Google users.
                */

                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {

                        uid:
                            user.uid,

                        name:
                            user.displayName ||
                            "Inspect Caller User",

                        email:
                            user.email,

                        role:
                            "user",

                        accountStatus:
                            "active",

                        updatedAt:
                            serverTimestamp()

                    },
                    {
                        merge: true
                    }
                );


                window.location.href =
                    "dashboard.html";


            } catch(error) {

                console.error(error);


                if (
                    error.code !==
                    "auth/popup-closed-by-user"
                ) {

                    showMessage(
                        "Google registration could not be completed."
                    );

                }

            }

        }
    );

</script>


</body>

</html>
