<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | FraudGuard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background: #0b1328;
            color: #ffffff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        /* ================= LOGIN CONTAINER ================= */

        .login-container {
            width: 100%;
            max-width: 430px;

            text-align: center;
        }

        /* ================= LOGO ================= */

        .logo {
            width: 85px;
            height: 85px;

            object-fit: contain;

            margin-bottom: 12px;
        }

        .brand {
            color: #22c55e;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #cbd5e1;

            font-size: 14px;

            margin-bottom: 25px;
        }

        /* ================= CARD ================= */

        .login-card {
            background: #1c263b;

            border: 1px solid #2d3953;

            border-radius: 12px;

            padding: 30px 25px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.25);
        }

        .login-card h1 {
            font-size: 27px;

            margin-bottom: 7px;
        }

        .login-card .description {
            color: #aeb7c7;

            font-size: 13px;

            margin-bottom: 23px;
        }

        /* ================= INPUT ================= */

        .input-group {
            text-align: left;

            margin-bottom: 16px;
        }

        .input-group label {
            display: block;

            color: #dce1e9;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .input-group input {
            width: 100%;

            padding: 13px 12px;

            border-radius: 7px;

            border: 1px solid #3b4760;

            background: #111a2f;

            color: #ffffff;

            outline: none;

            font-family: inherit;

            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #22c55e;

            box-shadow:
                0 0 0 2px
                rgba(34, 197, 94, 0.12);
        }

        .input-group input::placeholder {
            color: #7f8a9e;
        }

        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #22c55e;

            color: #ffffff;

            font-family: inherit;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #16a34a;
        }

        .login-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        /* ================= DIVIDER ================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 10px;

            margin: 20px 0;
        }

        .divider span {
            flex: 1;

            height: 1px;

            background: #354158;
        }

        .divider p {
            color: #8e99ac;

            font-size: 12px;
        }

        /* ================= GOOGLE ================= */

        .google-btn {
            width: 100%;

            padding: 11px;

            border-radius: 7px;

            border: 1px solid #3b4760;

            background: #111a2f;

            color: #ffffff;

            font-family: inherit;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .google-btn:hover {
            background: #18233b;

            border-color: #22c55e;
        }

        /* ================= ERROR ================= */

        .error-message {
            display: none;

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 7px;

            background: #401c28;

            border: 1px solid #7f3046;

            color: #ff9daf;

            font-size: 12px;
        }

        /* ================= SUCCESS ================= */

        .success-message {
            display: none;

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 7px;

            background: #123521;

            border: 1px solid #236b3b;

            color: #7ff0a2;

            font-size: 12px;
        }

        /* ================= FORGOT ================= */

        .forgot {
            display: block;

            text-align: right;

            margin-top: -7px;

            margin-bottom: 17px;

            color: #22c55e;

            font-size: 12px;

            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* ================= REGISTER ================= */

        .register-text {
            margin-top: 20px;

            color: #aeb7c7;

            font-size: 13px;
        }

        .register-text a {
            color: #22c55e;

            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* ================= FOOTER ================= */

        .footer {
            margin-top: 18px;

            color: #69758a;

            font-size: 11px;
        }

        /* ================= LOADING ================= */

        .page-loading {
            position: fixed;

            inset: 0;

            background: #0b1328;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 9999;
        }

        .page-loading-box {
            text-align: center;
        }

        .page-loading-box img {
            width: 60px;

            height: 60px;

            object-fit: contain;
        }

        .page-loading-box p {
            margin-top: 10px;

            color: #22c55e;

            font-size: 14px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            .brand {
                font-size: 26px;
            }

            .login-card {
                padding: 25px 18px;
            }

            .login-card h1 {
                font-size: 24px;
            }

        }

    </style>
</head>


<body>


<!-- ================= AUTH CHECK LOADING ================= -->

<div
    class="page-loading"
    id="pageLoading">

    <div class="page-loading-box">

        <img
            src="logo.png"
            alt="FraudGuard">

        <p>
            Checking session...
        </p>

    </div>

</div>


<!-- ================= LOGIN ================= -->

<div class="login-container">


    <img
        src="logo.png"
        alt="FraudGuard"
        class="logo">


    <div class="brand">
        FraudGuard
    </div>


    <div class="subtitle">
        AI-Powered Fraud Detection & Scam Prevention
    </div>


    <div class="login-card">


        <h1>
            Welcome Back
        </h1>


        <p class="description">
            Login to protect yourself from online scams.
        </p>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="error-message">
        </div>


        <!-- SUCCESS -->

        <div
            id="successMessage"
            class="success-message">
        </div>


        <!-- EMAIL -->

        <div class="input-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

        </div>


        <!-- FORGOT -->

        <a
            href="#"
            class="forgot"
            id="forgotPassword">

            Forgot password?

        </a>


        <!-- LOGIN -->

        <button
            type="button"
            class="login-btn"
            id="loginBtn">

            Login

        </button>


        <!-- DIVIDER -->

        <div class="divider">

            <span></span>

            <p>
                OR
            </p>

            <span></span>

        </div>


        <!-- GOOGLE -->

        <button
            type="button"
            class="google-btn"
            id="googleBtn">

            🔵 Continue with Google

        </button>


        <!-- REGISTER -->

        <p class="register-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>


    </div>


    <div class="footer">

        © 2026 FraudGuard.
        All rights reserved.

    </div>


</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

    import {
        auth
    } from "./firebase.js";


    import {
        onAuthStateChanged,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        GoogleAuthProvider,
        signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const pageLoading =
        document.getElementById(
            "pageLoading"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    const googleBtn =
        document.getElementById(
            "googleBtn"
        );


    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const successMessage =
        document.getElementById(
            "successMessage"
        );


    /* ================= MESSAGE FUNCTIONS ================= */


    function showError(message) {

        errorMessage.textContent =
            message;

        errorMessage.style.display =
            "block";

        successMessage.style.display =
            "none";
    }


    function showSuccess(message) {

        successMessage.textContent =
            message;

        successMessage.style.display =
            "block";

        errorMessage.style.display =
            "none";
    }


    function clearMessages() {

        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";
    }


    /* ================= SESSION CHECK ================= */

    onAuthStateChanged(
        auth,
        (user) => {

            if (user) {

                /*
                 * Already logged in.
                 *
                 * NO DASHBOARD.
                 *
                 * Directly open main Home.
                 */

                window.location.replace(
                    "index.html"
                );

            } else {

                pageLoading.style.display =
                    "none";

            }

        }
    );


    /* ================= EMAIL LOGIN ================= */

    loginBtn.addEventListener(
        "click",
        async () => {

            clearMessages();


            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            if (!email) {

                showError(
                    "Please enter your email address."
                );

                return;
            }


            if (!password) {

                showError(
                    "Please enter your password."
                );

                return;
            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "Logging in...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                showSuccess(
                    "Login successful. Opening FraudGuard..."
                );


                /*
                 * Go directly to Home.
                 * No dashboard.
                 */

                setTimeout(() => {

                    window.location.replace(
                        "index.html"
                    );

                }, 500);


            } catch (error) {

                console.error(error);


                let message =
                    "Unable to login. Please try again.";


                switch (error.code) {

                    case "auth/invalid-credential":

                        message =
                            "Incorrect email or password.";

                        break;


                    case "auth/invalid-email":

                        message =
                            "Please enter a valid email address.";

                        break;


                    case "auth/user-disabled":

                        message =
                            "This account has been disabled.";

                        break;


                    case "auth/too-many-requests":

                        message =
                            "Too many attempts. Please try again later.";

                        break;

                }


                showError(message);


                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "Login";

            }

        }
    );


    /* ================= GOOGLE LOGIN ================= */

    googleBtn.addEventListener(
        "click",
        async () => {

            clearMessages();


            googleBtn.disabled =
                true;

            googleBtn.textContent =
                "Connecting...";


            try {

                const provider =
                    new GoogleAuthProvider();


                await signInWithPopup(
                    auth,
                    provider
                );


                showSuccess(
                    "Google login successful."
                );


                setTimeout(() => {

                    window.location.replace(
                        "index.html"
                    );

                }, 500);


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/popup-closed-by-user"
                ) {

                    showError(
                        "Google login was cancelled."
                    );

                } else {

                    showError(
                        "Google login failed. Please try again."
                    );

                }


                googleBtn.disabled =
                    false;

                googleBtn.textContent =
                    "🔵 Continue with Google";

            }

        }
    );


    /* ================= PASSWORD RESET ================= */

    forgotPassword.addEventListener(
        "click",
        async (event) => {

            event.preventDefault();


            clearMessages();


            const email =
                emailInput.value.trim();


            if (!email) {

                showError(
                    "Enter your email first to reset your password."
                );

                emailInput.focus();

                return;
            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showSuccess(
                    "Password reset email sent. Check your inbox."
                );


            } catch (error) {

                console.error(error);


                showError(
                    "Unable to send password reset email."
                );

            }

        }
    );


    /* ================= ENTER KEY ================= */

    passwordInput.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key ===
                "Enter"
            ) {

                loginBtn.click();

            }

        }
    );

</script>


</body>
</html>
