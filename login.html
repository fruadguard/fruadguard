<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | FraudGuard</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">

</head>

<body>

<nav class="navbar">

<div class="logo">

<a href="index.html">

<img src="logo.png" alt="FraudGuard">

<span>FraudGuard</span>

</a>

</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="features.html">Features</a></li>
<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<section class="scanner">

<h2>Login to FraudGuard</h2>

<input
type="email"
id="email"
placeholder="Email">

<br><br>

<input
type="password"
id="password"
placeholder="Password">

<br><br>

<button class="btn-primary" onclick="login()">

🔑 Login

</button>

<br><br>

<button class="btn-secondary" onclick="signup()">

📝 Create Account

</button>

<br><br>

<button class="btn-secondary" onclick="googleLogin()">

🟢 Continue with Google

</button>

<br><br>

<p id="loginStatus"></p>

</section>
<script type="module">

import { auth } from "./firebase.js";

import {

signInWithEmailAndPassword,

createUserWithEmailAndPassword,

GoogleAuthProvider,

signInWithPopup

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const status=document.getElementById("loginStatus");

window.login=async function(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth,email,password);

status.innerHTML="✅ Login Successful";

window.location.href="dashboard.html";

}catch(error){

status.innerHTML="❌ "+error.message;

}

}

window.signup=async function(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

try{

await createUserWithEmailAndPassword(auth,email,password);

status.innerHTML="✅ Account Created Successfully";

}catch(error){

status.innerHTML="❌ "+error.message;

}

}

window.googleLogin=async function(){

const provider=new GoogleAuthProvider();

try{

await signInWithPopup(auth,provider);

status.innerHTML="✅ Google Login Successful";

window.location.href="dashboard.html";

}catch(error){

status.innerHTML="❌ "+error.message;

}

}

</script>

</body>

</html>
