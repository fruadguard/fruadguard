<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Inspect Caller</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071526;
      font-family: Arial, sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .login-box {
      background: #0d2035;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 18px;
      background: linear-gradient(135deg,#00d4ff,#2878ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 27px;
      font-weight: bold;
    }

    .logo h1 {
      margin: 14px 0 4px;
      color: white;
      font-size: 27px;
    }

    .logo p {
      margin: 0;
      color: #8da2b7;
      font-size: 13px;
    }

    .login-title {
      color: white;
      font-size: 22px;
      margin-bottom: 6px;
    }

    .login-subtitle {
      color: #8da2b7;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 17px;
    }

    .input-group label {
      display: block;
      color: #dce8f2;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .input-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid #28435c;
      background: #081a2c;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .input-group input:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 0 2px rgba(0,212,255,0.08);
    }

    .password-row {
      position: relative;
    }

    .show-password {
      position: absolute;
      right: 13px;
      top: 13px;
      background: none;
      border: none;
      color: #00d4ff;
      cursor: pointer;
      font-size: 12px;
    }

    .forgot {
      display: block;
      text-align: right;
      color: #00d4ff;
      font-size: 12px;
      text-decoration: none;
      margin-top: -7px;
      margin-bottom: 20px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg,#00d4ff,#2878ff);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #667f96;
      font-size: 12px;
      margin: 23px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #28435c;
    }

    .google-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #28435c;
      background: #102940;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .google-btn:hover {
      background: #15344e;
    }

    .register {
      text-align: center;
      margin-top: 23px;
      color: #8da2b7;
      font-size: 13px;
    }

    .register a {
      color: #00d4ff;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      display: none;
      padding: 11px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #7890a6;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="login-wrapper">

  <div class="login-box">

    <div class="logo">
      <div class="logo-icon">IC</div>

      <h1>Inspect Caller</h1>

      <p>Digital Fraud Intelligence & Protection</p>
    </div>

    <h2 class="login-title">Welcome Back</h2>

    <p class="login-subtitle">
      Sign in to access your fraud protection dashboard.
    </p>

    <div id="message"></div>

    <form id="loginForm">

      <div class="input-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="input-group">

        <label for="password">Password</label>

        <div class="password-row">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            Show
          </button>

        </div>

      </div>

      <a href="#" class="forgot" onclick="forgotPassword()">
        Forgot Password?
      </a>

      <button type="submit" class="login-btn" id="loginBtn">
        Sign In
      </button>

    </form>

    <div class="divider">
      OR
    </div>

    <button class="google-btn" id="googleLogin">
      Continue with Google
    </button>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <a href="index.html" class="back-home">
      ← Back to Inspect Caller
    </a>

  </div>

</div>

<!-- Firebase -->
<script type="module">

  import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    sendPasswordResetEmail
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  const firebaseConfig = {

    apiKey: "AIzaSyByZP0D_jKYOitPhOunqn44Z1FMNFF40tc",

    authDomain: "fraudguard-eafd2.firebaseapp.com",

    databaseURL:
      "https://fraudguard-eafd2-default-rtdb.firebaseio.com",

    projectId: "fraudguard-eafd2",

    storageBucket:
      "fraudguard-eafd2.firebasestorage.app",

    messagingSenderId: "721145048132",

    appId:
      "1:721145048132:web:5b40a07526b47230806011",

    measurementId: "G-M32E57QXD1"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const provider = new GoogleAuthProvider();


  const message = document.getElementById("message");


  function showMessage(text, success = false) {

    message.style.display = "block";

    message.textContent = text;

    message.style.background =
      success
      ? "rgba(36,224,132,0.12)"
      : "rgba(235,79,92,0.12)";

    message.style.color =
      success
      ? "#24e084"
      : "#ff6b78";
  }


  document
    .getElementById("loginForm")
    .addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const btn =
        document.getElementById("loginBtn");

      btn.disabled = true;

      btn.textContent = "Signing in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage(
          "Login successful. Redirecting...",
          true
        );

        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 800);

      }

      catch (error) {

        let msg = "Login failed. Please try again.";

        if (error.code === "auth/invalid-credential") {
          msg = "Invalid email or password.";
        }

        else if (error.code === "auth/user-not-found") {
          msg = "No account found with this email.";
        }

        else if (error.code === "auth/wrong-password") {
          msg = "Incorrect password.";
        }

        else if (error.code === "auth/too-many-requests") {
          msg = "Too many attempts. Please try again later.";
        }

        showMessage(msg);

      }

      finally {

        btn.disabled = false;

        btn.textContent = "Sign In";

      }

    });


  document
    .getElementById("googleLogin")
    .addEventListener("click", async () => {

      try {

        await signInWithPopup(auth, provider);

        window.location.href =
          "dashboard.html";

      }

      catch (error) {

        showMessage(
          "Google sign-in failed. Please try again."
        );

      }

    });


  window.forgotPassword = async function() {

    const email =
      document.getElementById("email").value.trim();

    if (!email) {

      showMessage(
        "Enter your email address first."
      );

      return;

    }

    try {

      await sendPasswordResetEmail(
        auth,
        email
      );

      showMessage(
        "Password reset email sent. Check your inbox.",
        true
      );

    }

    catch (error) {

      showMessage(
        "Could not send reset email. Check the email address."
      );

    }

  };


  window.togglePassword = function() {

    const password =
      document.getElementById("password");

    const button =
      document.querySelector(".show-password");

    if (password.type === "password") {

      password.type = "text";

      button.textContent = "Hide";

    }

    else {

      password.type = "password";

      button.textContent = "Show";

    }

  };

</script>

</body>
</html>
