<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
FraudGuard Login
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<section class="section">



<h2>

Login To FraudGuard

</h2>



<div class="analyzer-box">



<input

id="email"

type="email"

placeholder="Email Address"

>



<input

id="password"

type="password"

placeholder="Password"

>




<button

id="loginBtn"

class="btn">

Login

</button>





<p id="message"></p>




<p>

Don't have an account?

<a href="register.html">

Create Account

</a>

</p>



</div>


</section>







<script type="module">



import {

loginUser

}

from "./firebase.js";






const loginButton =

document.getElementById(
"loginBtn"
);






loginButton.addEventListener(

"click",

async()=>{



const email =

document.getElementById(
"email"
).value;





const password =

document.getElementById(
"password"
).value;





const message =

document.getElementById(
"message"
);






try{


await loginUser(

email,

password

);





message.innerHTML =

"Login Successful!";





setTimeout(()=>{


window.location.href =

"dashboard.html";



},1000);






}

catch(error){



message.innerHTML =

"Login Failed: "
+
error.message;



}





}



);



</script>




</body>


</html>
