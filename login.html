<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - FraudGuard</title>

<meta name="description" content="Login to your FraudGuard account.">

<link rel="icon" href="logo.png">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="auth-section">

<div class="auth-box">

<div style="text-align:center; margin-bottom:20px;">

<img src="logo.png"
alt="FraudGuard Logo"
style="width:90px;">

<h1>FraudGuard</h1>

<p>Protect Yourself From Online Fraud</p>

</div>

<form id="loginForm">

<div class="input-group">

<label>Email</label>

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required>

</div>
<!-- Remember Me + Forgot Password -->

<div class="login-options">

<label>

<input type="checkbox" id="rememberMe">

Remember Me

</label>


<a href="forgot-password.html">

Forgot Password?

</a>

</div>





<!-- LOGIN BUTTON -->

<button

type="button"

class="btn"

onclick="loginUser()">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>





<!-- Divider -->

<div class="divider">

<span>OR</span>

</div>





<!-- GOOGLE LOGIN -->

<button

type="button"

class="btn google-btn"

id="googleLoginBtn">

<i class="fa-brands fa-google"></i>

Continue with Google

</button>





<!-- CREATE ACCOUNT -->

<p class="register-link">

Don't have an account?

<a href="register.html">

Create New Account

</a>

</p>

</form>

</div>

</div>
<!-- =========================
        FOOTER
========================= -->

<footer>

<div class="container">

<p>

© 2026 FraudGuard. All Rights Reserved.

</p>

</div>

</footer>







<!-- FIREBASE -->

<script type="module" src="firebase.js"></script>





<!-- SCRIPT -->

<script src="script.js"></script>

</body>

</html>
