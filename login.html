<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — Inspect Caller</title>

    <meta
        name="description"
        content="Securely login to your Inspect Caller account."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ================= PAGE ================= */

        .login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 16px;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(0,160,255,.16),
                    transparent 42%
                ),
                #050d18;

            overflow: hidden;

            position: relative;

        }


        /* ================= BACKGROUND ================= */

        .login-orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(70px);

            pointer-events: none;

        }

        .orb-one {

            width: 220px;
            height: 220px;

            top: 8%;
            left: 8%;

            background:
                rgba(0,140,255,.08);

            animation:
                floatOrb 7s ease-in-out infinite;

        }

        .orb-two {

            width: 250px;
            height: 250px;

            right: 5%;
            bottom: 5%;

            background:
                rgba(0,220,180,.06);

            animation:
                floatOrb 9s ease-in-out infinite reverse;

        }

        @keyframes floatOrb {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

        }


        /* ================= LOGIN BOX ================= */

        .login-wrapper {

            width: min(430px, 100%);

            position: relative;

            z-index: 2;

            animation:
                loginEnter .7s ease;

        }

        @keyframes loginEnter {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .login-card {

            padding: 35px;

            border:
                1px solid #1d465e;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10,32,52,.96),
                    rgba(5,19,31,.96)
                );

            box-shadow:
                0 30px 90px
                rgba(0,80,140,.18);

            backdrop-filter:
                blur(18px);

        }


        /* ================= BRAND ================= */

        .login-brand {

            text-align: center;

            margin-bottom: 28px;

        }

        .brand-icon {

            width: 64px;
            height: 64px;

            display: grid;

            place-items: center;

            margin: 0 auto 16px;

            border:
                1px solid #2a7398;

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    #0b3652,
                    #071a2b
                );

            box-shadow:
                0 0 35px
                rgba(0,150,255,.12);

            font-size: 28px;

            animation:
                shieldPulse 2.5s ease-in-out infinite;

        }

        @keyframes shieldPulse {

            0%,100% {
                box-shadow:
                    0 0 25px
                    rgba(0,150,255,.08);
            }

            50% {
                box-shadow:
                    0 0 45px
                    rgba(0,150,255,.2);
            }

        }


        .login-brand h1 {

            font-size: 25px;

            letter-spacing: -.8px;

        }

        .login-brand h1 span {

            color: var(--blue);

        }

        .login-brand p {

            margin-top: 7px;

            color: var(--muted);

            font-size: 11px;

        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 17px;

        }

        .form-label {

            display: block;

            margin-bottom: 8px;

            color: #b9d2de;

            font-size: 11px;

            font-weight: 800;

        }


        .input-wrap {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 15px;

            opacity: .8;

        }


        .login-input {

            width: 100%;

            min-height: 50px;

            padding:
                0 44px;

            border:
                1px solid #28536b;

            border-radius: 13px;

            outline: none;

            background: #061725;

            color: #ffffff;

            font-size: 13px;

            transition: .2s;

        }

        .login-input::placeholder {

            color: #587384;

        }

        .login-input:focus {

            border-color:
                #24b7ff;

            box-shadow:
                0 0 0 3px
                rgba(0,160,255,.08);

        }


        .password-toggle {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #7895a5;

            cursor: pointer;

            font-size: 14px;

        }

        .password-toggle:hover {

            color: #ffffff;

        }


        /* ================= OPTIONS ================= */

        .login-options {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin:
                5px 0 20px;

        }


        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #7895a5;

            font-size: 10px;

            cursor: pointer;

        }

        .remember input {

            accent-color:
                #159ddd;

        }


        .forgot {

            color: #72d2ff;

            font-size: 10px;

            font-weight: 700;

        }


        /* ================= LOGIN BUTTON ================= */

        .login-btn {

            width: 100%;

            min-height: 51px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #25b5ff,
                    #087ddd
                );

            color: #ffffff;

            font-size: 12px;

            font-weight: 900;

            cursor: pointer;

            transition: .25s;

            box-shadow:
                0 10px 30px
                rgba(0,130,220,.15);

        }

        .login-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 35px
                rgba(0,140,255,.25);

        }

        .login-btn:disabled {

            opacity: .65;

            cursor: not-allowed;

            transform: none;

        }


        /* ================= DIVIDER ================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 22px 0;

            color: #536f7f;

            font-size: 9px;

        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                #18394e;

        }


        /* ================= GOOGLE ================= */

        .google-btn {

            width: 100%;

            min-height: 47px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            border:
                1px solid #28536b;

            border-radius: 13px;

            background:
                #071b2b;

            color: #c2d5de;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;

        }

        .google-btn:hover {

            border-color:
                #397a9e;

            background:
                #092238;

        }


        /* ================= REGISTER ================= */

        .register-text {

            margin-top: 24px;

            text-align: center;

            color: #708a99;

            font-size: 11px;

        }

        .register-text a {

            color: #6fd4ff;

            font-weight: 800;

        }


        /* ================= SECURITY ================= */

        .security-note {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 21px;

            color: #5f7887;

            font-size: 9px;

        }


        /* ================= ERROR ================= */

        .form-message {

            display: none;

            margin-bottom: 15px;

            padding:
                11px 13px;

            border-left:
                3px solid #ff687e;

            border-radius: 9px;

            background:
                rgba(255,70,95,.06);

            color: #e7aeb6;

            font-size: 10px;

            line-height: 1.5;

        }

        .form-message.show {

            display: block;

        }


        /* ================= MOBILE ================= */

        @media(max-width: 500px) {

            .login-card {

                padding: 25px 20px;

            }

            .login-page {

                padding:
                    20px 12px;

            }

        }

    </style>

</head>


<body>


<div class="login-page">


    <div class="login-orb orb-one"></div>

    <div class="login-orb orb-two"></div>


    <div class="login-wrapper">


        <div class="login-card">


            <!-- BRAND -->

            <div class="login-brand">

                <div class="brand-icon">
                    🛡️
                </div>


                <h1>

                    INSPECT<span>CALLER</span>

                </h1>


                <p>
                    Secure access to your digital
                    safety dashboard
                </p>

            </div>



            <!-- MESSAGE -->

            <div
                id="formMessage"
                class="form-message">
            </div>



            <!-- FORM -->

            <form
                id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="email">

                        Email Address

                    </label>


                    <div class="input-wrap">

                        <span class="input-icon">
                            ✉️
                        </span>


                        <input
                            type="email"
                            id="email"
                            class="login-input"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="password">

                        Password

                    </label>


                    <div class="input-wrap">

                        <span class="input-icon">
                            🔒
                        </span>


                        <input
                            type="password"
                            id="password"
                            class="login-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">

                            👁️

                        </button>

                    </div>

                </div>



                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember">

                        Remember me

                    </label>


                    <a
                        href="#"
                        class="forgot"
                        id="forgotPassword">

                        Forgot password?

                    </a>

                </div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn">

                    🔐 Secure Login

                </button>


            </form>



            <!-- DIVIDER -->

            <div class="divider">
                OR CONTINUE WITH
            </div>



            <!-- GOOGLE -->

            <button
                type="button"
                class="google-btn"
                id="googleLogin">

                <span>
                    G
                </span>

                Continue with Google

            </button>



            <!-- REGISTER -->

            <div class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>



            <!-- SECURITY -->

            <div class="security-note">

                🛡️

                Protected authentication

                •

                Inspect Caller Security

            </div>


        </div>


    </div>

</div>



<!-- ================= FIREBASE AUTH ================= -->

<script type="module">

import {
    auth
} from "./firebase.js";


import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    GoogleAuthProvider,
    signInWithPopup,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


/* ================= ELEMENTS ================= */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("formMessage");

const remember =
    document.getElementById("remember");



/* ================= MESSAGE ================= */

function showMessage(text) {

    message.textContent = text;

    message.classList.add("show");

}


function hideMessage() {

    message.textContent = "";

    message.classList.remove("show");

}



/* ================= PASSWORD ================= */

document
    .getElementById("togglePassword")
    .addEventListener(
        "click",
        function() {

            const isPassword =
                passwordInput.type === "password";


            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";


            this.textContent =
                isPassword
                    ? "🙈"
                    : "👁️";

        }
    );



/* ================= LOGIN ================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "⏳ Authenticating...";


        try {


            /*

                Choose Firebase session type.

            */

            await setPersistence(
                auth,
                remember.checked
                    ? browserLocalPersistence
                    : browserSessionPersistence
            );


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "Login successful:",
                result.user.uid
            );


            loginBtn.textContent =
                "✓ Login Successful";


            setTimeout(
                function() {

                    window.location.href =
                        "dashboard.html";

                },
                500
            );


        } catch(error) {

            console.error(error);


            loginBtn.disabled = false;

            loginBtn.textContent =
                "🔐 Secure Login";


            let errorText =
                "Unable to login. Please try again.";


            switch(error.code) {

                case "auth/invalid-email":

                    errorText =
                        "Please enter a valid email address.";

                    break;


                case "auth/invalid-credential":

                    errorText =
                        "Incorrect email or password.";

                    break;


                case "auth/user-not-found":

                    errorText =
                        "No account was found with this email.";

                    break;


                case "auth/wrong-password":

                    errorText =
                        "Incorrect password.";

                    break;


                case "auth/too-many-requests":

                    errorText =
                        "Too many attempts. Please try again later.";

                    break;


                case "auth/network-request-failed":

                    errorText =
                        "Network error. Check your internet connection.";

                    break;

            }


            showMessage(errorText);

        }

    }
);



/* ================= FORGOT PASSWORD ================= */

document
    .getElementById("forgotPassword")
    .addEventListener(
        "click",
        async function(event) {

            event.preventDefault();

            hideMessage();


            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Enter your email address first."
                );

                emailInput.focus();

                return;

            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showMessage(
                    "Password reset email sent. Check your inbox."
                );


            } catch(error) {

                console.error(error);


                showMessage(
                    "Unable to send reset email. Please check the email address."
                );

            }

        }
    );



/* ================= GOOGLE LOGIN ================= */

document
    .getElementById("googleLogin")
    .addEventListener(
        "click",
        async function() {

            hideMessage();


            try {

                const provider =
                    new GoogleAuthProvider();


                await signInWithPopup(
                    auth,
                    provider
                );


                window.location.href =
                    "dashboard.html";


            } catch(error) {

                console.error(error);


                if (
                    error.code !==
                    "auth/popup-closed-by-user"
                ) {

                    showMessage(
                        "Google login could not be completed."
                    );

                }

            }

        }
    );

</script>


</body>

</html>
