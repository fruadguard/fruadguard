<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
FraudGuard Admin Panel
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>



<section class="section">



<h1>

🛡️ FraudGuard Admin Panel

</h1>



<div id="adminArea">



<h2>

Users Management

</h2>




<table border="1" width="100%">


<thead>

<tr>

<th>
Name
</th>


<th>
Email
</th>


<th>
Role
</th>


<th>
Plan
</th>


<th>
Status
</th>


</tr>


</thead>



<tbody id="userList">


</tbody>



</table>




</div>





<h2 id="accessDenied">

</h2>



</section>









<script type="module">


import {

checkUser,

getUserRole,

getAllUsers

}

from "./firebase.js";








const adminArea =

document.getElementById(
"adminArea"
);



const denied =

document.getElementById(
"accessDenied"
);






checkUser(async(user)=>{



if(!user){



window.location.href =
"login.html";


return;


}





const role =

await getUserRole(
user.uid
);






if(role !== "admin"){



adminArea.style.display =
"none";



denied.innerHTML =

"❌ Access Denied - Admin Only";



return;



}






const users =

await getAllUsers();





const table =

document.getElementById(
"userList"
);





users.forEach((user)=>{



table.innerHTML += `


<tr>


<td>

${user.name || "N/A"}

</td>



<td>

${user.email}

</td>



<td>

${user.role}

</td>



<td>

${user.plan}

</td>



<td>

${user.subscriptionStatus}

</td>



</tr>


`;



});




});




</script>




</body>

</html>
