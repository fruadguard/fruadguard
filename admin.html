<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login | FraudGuard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#0b1328;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-card{
    width:100%;
    max-width:420px;

    background:#1c263b;

    border:1px solid #2d3953;

    border-radius:14px;

    padding:30px;

    box-shadow:
    0 15px 45px
    rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    margin-bottom:22px;
}

.logo img{
    width:55px;
    height:55px;
    object-fit:contain;

    margin-bottom:10px;
}

.logo h1{
    color:#22c55e;
    font-size:25px;
}

.logo p{
    color:#8995aa;
    font-size:12px;
    margin-top:6px;
}

.admin-badge{
    width:max-content;

    margin:0 auto 22px;

    padding:7px 13px;

    border-radius:20px;

    background:#123521;
    border:1px solid #236b3b;

    color:#67e895;

    font-size:11px;
    font-weight:bold;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;

    margin-bottom:7px;

    color:#dce1e9;

    font-size:12px;
    font-weight:bold;
}

.field input{
    width:100%;

    padding:13px;

    border-radius:7px;

    border:1px solid #3b4760;

    background:#111a2f;

    color:#fff;

    outline:none;

    font-size:14px;
}

.field input:focus{
    border-color:#22c55e;

    box-shadow:
    0 0 0 2px
    rgba(34,197,94,.12);
}

#adminEmail{
    opacity:.7;
}

.login-btn{
    width:100%;

    padding:13px;

    border:0;

    border-radius:7px;

    background:#22c55e;

    color:#fff;

    font-size:14px;
    font-weight:bold;

    cursor:pointer;
}

.login-btn:hover{
    background:#16a34a;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;

    margin-bottom:16px;

    padding:11px;

    border-radius:7px;

    font-size:12px;

    line-height:1.5;
}

.error{
    background:#401c28;

    border:1px solid #7f3046;

    color:#ff9daf;
}

.info{
    margin-top:18px;

    text-align:center;

    color:#68758a;

    font-size:10px;
}

.back{
    display:block;

    text-align:center;

    margin-top:18px;

    color:#8f9bad;

    font-size:11px;
}

.back:hover{
    color:#22c55e;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">

<img
src="logo.png"
alt="FraudGuard">

<h1>
FraudGuard
</h1>

<p>
Administrator Control Panel
</p>

</div>


<div class="admin-badge">
🔐 ADMIN ACCESS
</div>


<div
id="errorMessage"
class="message error">
</div>


<div class="field">

<label>
ADMIN EMAIL
</label>

<input
id="adminEmail"
type="email"
value="rbiplob1005@gmail.com"
readonly>

</div>


<div class="field">

<label>
PASSWORD
</label>

<input
id="adminPassword"
type="password"
placeholder="Enter admin password"
autocomplete="current-password">

</div>


<button
id="loginBtn"
class="login-btn">

Admin Login

</button>


<a
href="login.html"
class="back">

← Back to User Login

</a>


<div class="info">

FraudGuard administrator access is restricted
to authorized personnel.

</div>

</div>
<script type="module">

import {
    auth
} from "./firebase.js";

import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ADMIN_EMAIL =
    "rbiplob1005@gmail.com";


const adminEmail =
    document.getElementById("adminEmail");

const adminPassword =
    document.getElementById("adminPassword");

const loginBtn =
    document.getElementById("loginBtn");

const errorMessage =
    document.getElementById("errorMessage");


function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";

}


function hideError() {

    errorMessage.style.display =
        "none";

}


onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {
            return;
        }


        if (
            user.email?.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()
        ) {

            window.location.replace(
                "admin.html"
            );

            return;

        }


        await signOut(auth);

    }
);


async function adminLogin() {

    hideError();


    const email =
        adminEmail.value
            .trim()
            .toLowerCase();


    const password =
        adminPassword.value;


    if (
        email !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        showError(
            "This account is not authorized for administrator access."
        );

        return;

    }


    if (!password) {

        showError(
            "Please enter the admin password."
        );

        adminPassword.focus();

        return;

    }


    loginBtn.disabled =
        true;

    loginBtn.textContent =
        "Signing in...";


    try {

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            result.user;


        if (
            user.email?.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            await signOut(auth);

            showError(
                "Administrator access denied."
            );

            return;

        }


        window.location.replace(
            "admin.html"
        );


    } catch (error) {

        console.error(
            "Admin login error:",
            error
        );


        let message =
            "Admin login failed.";


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            message =
                "Incorrect admin email or password.";

        }


        if (
            error.code ===
            "auth/invalid-email"
        ) {

            message =
                "Invalid administrator email.";

        }


        if (
            error.code ===
            "auth/too-many-requests"
        ) {

            message =
                "Too many attempts. Please try again later.";

        }


        showError(message);

    }


    loginBtn.disabled =
        false;

    loginBtn.textContent =
        "Admin Login";

}


loginBtn.addEventListener(
    "click",
    adminLogin
);


adminPassword.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            adminLogin();

        }

    }
);


</script>


</body>

</html>
