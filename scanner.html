<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Scanner | FraudGuard</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">
</head>

<body>

<!-- Navbar -->

<nav class="navbar">

<div class="logo">
<a href="index.html">
<img src="logo.png" alt="FraudGuard Logo">
<span>FraudGuard</span>
</a>
</div>

<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="features.html">Features</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="login.html" class="login-btn">Login</a></li>
</ul>

</nav>

<!-- Hero -->

<section class="hero">

<h1>🌐 Website URL Scanner</h1>

<p>
Scan any website using Google Safe Browsing and FraudGuard AI.
</p>

</section>

<!-- Scanner -->

<section class="scanner">

<h2>Scan Website</h2>

<input 
id="urlInput"
class="input-box"
placeholder="Enter website URL">

<br><br>

<button class="btn-primary" onclick="scanURL()">
🔍 Scan Website
</button>

<div id="resultBox" style="display:none;margin-top:30px;">

<div class="card">

<h2>Scan Result</h2>

<h3 id="scanResult">Waiting...</h3>

<p id="riskScore"></p>

<p id="googleStatus"></p>

<p id="aiStatus"></p>

<hr>

<h3>Security Details</h3>

<p><strong>Scan Time:</strong> <span id="scanTime">-</span></p>

<p><strong>Risk Level:</strong> <span id="riskLevel">-</span></p>

<div style="width:100%;height:20px;background:#ddd;border-radius:10px;overflow:hidden;">

<div id="riskBar"
style="width:0%;height:20px;background:#22c55e;transition:0.5s;">
</div>

</div>

<br>

<button onclick="copyResult()" class="btn-secondary">
📋 Copy Result
</button>

<button onclick="shareResult()" class="btn-secondary">
📤 Share Result
</button>

<button onclick="reportWebsite()" class="btn-primary">
🚨 Report Website
</button>l
  <button onclick="scanURL()" class="scan-btn">
Scan Website
  </button>

</div>

<hr>

<h2>Recent Scans</h2>

<div id="historyList"></div>

<br>

<button onclick="downloadResult()" class="btn-secondary">
📄 Download Result
</button>

</div>

</section>
<script>

let history=[];

async function scanURL(){

const url=document.getElementById("urlInput").value.trim();

const resultBox=document.getElementById("resultBox");
const scanResult=document.getElementById("scanResult");
const riskScore=document.getElementById("riskScore");
const googleStatus=document.getElementById("googleStatus");
const aiStatus=document.getElementById("aiStatus");

if(url===""){

alert("Please enter a website URL.");

return;

}

resultBox.style.display="block";

scanResult.innerHTML="🔍 Scanning...";
scanResult.style.color="#f59e0b";

riskScore.innerHTML="";
googleStatus.innerHTML="";
aiStatus.innerHTML="";

try{

const response=await fetch("https://safebrowsing.googleapis.com/v4/threatMatches:find?key=YOUR_NEW_API_KEY",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

client:{
clientId:"FraudGuard",
clientVersion:"1.0"
},

threatInfo:{

threatTypes:[
"MALWARE",
"SOCIAL_ENGINEERING",
"UNWANTED_SOFTWARE"
],

platformTypes:[
"ANY_PLATFORM"
],

threatEntryTypes:[
"URL"
],

threatEntries:[
{url:url}
]

}

})

});

const data=await response.json();

document.getElementById("scanTime").innerHTML=new Date().toLocaleString();

if(data.matches){

scanResult.innerHTML="🚨 Dangerous Website";
scanResult.style.color="red";

riskScore.innerHTML="AI Risk Score: 95%";

googleStatus.innerHTML="🛡 Google Safe Browsing: Unsafe";

aiStatus.innerHTML="🤖 FraudGuard AI: High Risk";

document.getElementById("riskLevel").innerHTML="HIGH";

document.getElementById("riskBar").style.width="95%";

document.getElementById("riskBar").style.background="red";

}else{

scanResult.innerHTML="✅ Website Looks Safe";
scanResult.style.color="#22c55e";

riskScore.innerHTML="AI Risk Score: 5%";

googleStatus.innerHTML="🛡 Google Safe Browsing: Safe";

aiStatus.innerHTML="🤖 FraudGuard AI: Low Risk";

document.getElementById("riskLevel").innerHTML="LOW";

document.getElementById("riskBar").style.width="5%";

document.getElementById("riskBar").style.background="#22c55e";

}

saveHistory(url,scanResult.innerText,riskScore.innerText);

}catch(error){

scanResult.innerHTML="❌ Scan Failed";

scanResult.style.color="red";

googleStatus.innerHTML=error.message;

}

}
function copyResult(){

const text=
document.getElementById("scanResult").innerText+"\n"+
document.getElementById("riskScore").innerText+"\n"+
document.getElementById("googleStatus").innerText+"\n"+
document.getElementById("aiStatus").innerText;

navigator.clipboard.writeText(text);

alert("Result copied successfully!");

}

function shareResult(){

const text=
document.getElementById("scanResult").innerText+"\n"+
document.getElementById("riskScore").innerText;

if(navigator.share){

navigator.share({
title:"FraudGuard Scan Result",
text:text
});

}else{

alert("Sharing is not supported on this device.");

}

}

function reportWebsite(){

const url=document.getElementById("urlInput").value.trim();

if(url===""){

alert("Please enter a website URL.");

return;

}

window.location.href="report.html?url="+encodeURIComponent(url);

}

function saveHistory(url,result,risk){

history.unshift({
url:url,
result:result,
risk:risk,
time:new Date().toLocaleString()
});

if(history.length>10){
history.pop();
}

showHistory();

}

function showHistory(){

const list=document.getElementById("historyList");

list.innerHTML="";

history.forEach(item=>{

list.innerHTML+=`
<div class="card">
<h3>${item.url}</h3>
<p>${item.result}</p>
<p>${item.risk}</p>
<p>${item.time}</p>
</div>
`;

});

}

function downloadResult(){

const text=
document.getElementById("scanResult").innerText+"\n"+
document.getElementById("riskScore").innerText+"\n"+
document.getElementById("googleStatus").innerText+"\n"+
document.getElementById("aiStatus").innerText;

const blob=new Blob([text],{type:"text/plain"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="FraudGuard-Scan-Result.txt";

a.click();

}

</script>

</body>
</html>
