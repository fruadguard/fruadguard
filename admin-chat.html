<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Chat - FraudGuard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>



<div class="container">


<div class="card">


<h2>

Admin Support Chat

</h2>



<div id="adminChatBody" class="chat-body">


Loading messages...


</div>





<div class="chat-input">


<input

id="adminMessage"

placeholder="Reply to user...">



<button id="sendAdminReply" class="btn">

Send

</button>


</div>


</div>


</div>







<script type="module">


import { db } from "./firebase.js";



import {


collection,

addDoc,

onSnapshot,

query,

orderBy,

serverTimestamp


}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





const chatID = localStorage.getItem("activeChat");



const chatBody =
document.getElementById("adminChatBody");


const adminMessage =
document.getElementById("adminMessage");


const sendReply =
document.getElementById("sendAdminReply");






const messagesRef = collection(

db,

"chats",

chatID,

"messages"

);





const q = query(

messagesRef,

orderBy("time","asc")

);






onSnapshot(q,(snapshot)=>{


chatBody.innerHTML="";



snapshot.forEach((doc)=>{


const data = doc.data();



chatBody.innerHTML += `


<p class="${data.sender==="admin" ? "bot-msg":"user-msg"}">


${data.text}


</p>


`;



});



});







sendReply.onclick = async()=>{



const msg = adminMessage.value.trim();



if(msg==="") return;





await addDoc(

messagesRef,

{


text:msg,

sender:"admin",

time:serverTimestamp()


}


);



adminMessage.value="";



};




</script>


</body>

</html>
